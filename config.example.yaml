# ============================================================

filter:
  # 命中任一 → 直接判为 5 分（最高），并跳过下面的 drop 规则
  l3_keywords:
    - 选课
    - 补退选
    - 退课
    - 报名截止
    - 截止日期
    - 缴费
    - 报到
    - 注册
    - 体测
    - 军训
    - 四六级
    - 成绩
    - 学籍
    - 缓考
    - 重修
    - 宿舍
    - 停电
    - 停水
    - 退学
    - 警告处分

  # 命中任一 → 判为 4 分
  l2_keywords:
    - 考试
    - 奖学金
    - 助学金
    - 评优
    - 竞赛
    - 报名
    - 交换
    - 实习
    - 培养方案
    - 学分

  # 命中任一 → 直接丢弃（除非同时命中 l3）
  drop_keywords:
    - 活动回顾
    - 圆满结束
    - 精彩瞬间
    - 顺利举办
    - 胜利召开
    - 点赞
    - 转发
    - 招聘会预告

  # 正文里出现"截止/报名时间"且距今 <= N 天 → 重要度 +1
  deadline_urgent_days: 3

  # ★ 日期衰减：发布日期超过 N 天的，重要度一律压到 2 分以下。
  #   4 月的「停电停水通知」命中关键词也不该显示成 5 分 —— 它对你今天毫无价值。
  #   例外：正文里提到未来日期（"9月25日前完成"）的不降级。
  importance_decay_days: 7

  # ★ 保留期：超过 N 天的条目直接不入库，
  #   库里已有的也会被定时清掉（每轮抓取开始时 + 每天凌晨 4 点）。
  #   ★ 你手动标了「星标」的一律保留，不会被清。
  #   这是「实时通知」该有的行为——两周前的旧通知对你没价值。
  retention_days: 14

  # 看板默认隐藏超过 N 天的（保留期内基本用不到，留作兜底）
  visible_days: 14


  # 正文里提到未来 N 天内的日期 → 认为还没过期，不降级也不隐藏
  upcoming_days: 30

  # ★ 但这个「有未来日期」的例外本身要有年龄上限：
  #   通知本身超过 N 天的，即使正文提到未来日期也照样丢掉。
  #   否则一条 75 天前的旧通知里随便提个未来日期就能永久赖在库里。
  #   讲座类由 expires_field 那条规则保护，不受这个上限影响。
  stale_exempt_max_age_days: 45


# ============================================================
#  LLM 精判 + 抽取：第二道漏斗
#  只对通过预筛、且重要度 >= llm.min_importance_for_llm 的文章调用
# ============================================================

llm:
  enabled: false                 # 填好 api_key 后改成 true
  provider: deepseek
  base_url: https://api.deepseek.com
  api_key: ""                    # 建议用环境变量 NOTICE_HUB_LLM_KEY，别写这里
  model: deepseek-chat
  min_importance_for_llm: 4      # 4 分及以上才送 LLM（省钱的关键）
  max_calls_per_run: 20          # 单次最多调用几次，防跑飞
  timeout_seconds: 60
  concurrency: 3


# ============================================================
#  推送
# ============================================================

notify:
  # 重要度达到多少才推送（5=只推最致命，4=推荐）
  min_importance: 4

  # 每天最多即时推送几条，超出的攒成日报
  instant_push_max_per_day: 8

  wechat:
    enabled: false
    appid: ""                    # 微信测试号的 appID
    appsecret: ""                # 微信测试号的 appsecret
    openid: ""                   # 你的 openid（测试号后台"用户列表"里）
    template_id: ""              # 测试模板 ID
    # 想用环境变量就留空上面几项，改用：
    #   NOTICE_HUB_WX_APPID / NOTICE_HUB_WX_SECRET
    #   NOTICE_HUB_WX_OPENID / NOTICE_HUB_WX_TEMPLATE

  # 什么级别的消息会真的发出去
  quiet_hours:
    enabled: false
    start: "23:30"
    end: "06:30"
    # 静默时段内仍然允许推送的最低重要度
    allow_min_importance: 5
