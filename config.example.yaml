      enabled: true
      url: http://www.dean.pku.edu.cn/web/notice.php?type=7
      item_selector: "div.notice_item"
      title_selector: "a"
      link_selector: "a"
      weight: 1.5
    - name: 教务部·转专业与招生
      campus: 北大本部
      enabled: true
      url: http://www.dean.pku.edu.cn/web/notice.php?type=3
