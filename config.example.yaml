# ============================================================
#  通知中枢 notice-hub  ·  配置模板
#  第一次运行会自动复制成 config.yaml，之后只改 config.yaml
# ============================================================

server:
  host: 0.0.0.0          # 0.0.0.0 = 允许手机/其他设备访问
  port: 8787
  open_browser: true     # 启动时自动打开看板
  lan_access: true       # 桌面 App 模式下也监听局域网，手机才能连上

# 每隔多少分钟抓取一次
poll_interval_minutes: 10

# 日志级别: DEBUG / INFO / WARNING
log_level: INFO


# ============================================================
#  采集源
# ============================================================

sources:

  # ---------- RSS（公众号文章、任意网站订阅） ----------
  # ⚠️ 你要的 12 个北大公众号，Wechat2RSS 免费库里一个都没有（实测 395 个号零命中）。
  #    唯一可靠的路线是 Wechat2RSS 私有部署（15元/月 或 150元/年，支持任意公众号，
  #    平均 6 小时延迟），见 README「公众号怎么办」一节。
  #    部署好之后，把每个号的 feed 地址按下面格式填进来即可。
  rss: []
    # - name: 北京大学百家讲坛
    #   url: http://你的私有部署地址/feed/xxxxxxxx.xml
    #   enabled: true
    #   weight: 1.2
    # - name: 北京大学就业指导中心
    #   url: http://你的私有部署地址/feed/xxxxxxxx.xml
    #   enabled: true
    #   weight: 1.3

  # ---------- 邮箱（校内邮箱，最可靠的源头） ----------
  imap: []
    # - name: 校内邮箱
    #   enabled: true
    #   host: imap.pku.edu.cn
    #   port: 993
    #   ssl: true
    #   username: 你的学号@pku.edu.cn
    #   password: 邮箱授权码        # 多数邮箱要单独申请"授权码"，不是登录密码
    #   mailbox: INBOX
    #   since_days: 3              # 只读最近几天的未读
    #   weight: 1.5

  # ---------- JSON 接口 ----------
  # 给那些"列表由 JS 异步加载、静态 HTML 抓不到"的站用。
  # 很多学校站是 Yii/Spring 框架：同一个 URL 带 X-Requested-With 头请求会返回 JSON。
  api:
    # 北大讲座网 —— 「北京大学百家讲坛」「北大讲坛online」最完整的替代。
    # 静态页面抓不到（列表是 JS 渲染的），但带 XHR 头请求同一个 URL 会返回 JSON。
    # 实测共 941 场讲座，含主讲人、地点、开讲时间。
    - name: 北大讲座网
      campus: 北大本部
      enabled: true
      url: https://resource.pku.edu.cn/index.php
      params:
        r: lecturepre/index
        per-page: "60"
        order: "addtime desc"
        "search[status][eq]": "1"
      headers:
        X-Requested-With: XMLHttpRequest
      items_path: data
      title_field: subject
      url_template: "https://lecture.pku.edu.cn/index.php?r=lecturepre/view&id={id}"
      date_field: addtime            # 发布时间，用来判断"是不是新发的"
      # 有效期字段：讲座即使一个月前发布，只要还没开讲就不算过期
      expire_field: begintime
      # 整站都是讲座，规则分类拿不准时用这个兜底
      default_category: 讲座讲坛
      content_fields: [begintime, speaker, place, unit, content]
      field_labels:
        begintime: 开讲时间
        speaker: 主讲人
        place: 地点
        unit: 主办单位
        content: 简介
      interval_minutes: 10
      limit: 60
      weight: 1.5

    # ===== 北大就业指导服务中心（scc.pku.edu.cn）=====
    # 不是 SPA，是服务端渲染 + 同域 JSON 接口。实测零鉴权：
    # 不需要 token / cookie / X-Requested-With，裸请求就返回 JSON。
    # 注意：它的 /f/xxx/show 这类 HTML 详情页会 302 跳登录，
    #       但对应的 ajax_* 接口是公开的，所以只走接口。
    - name: 北大就业·通知公告
      campus: 北大本部
      enabled: true
      url: https://scc.pku.edu.cn/f/newsCenter/ajax_thisNewsAndSiblingCategoryList
      method: POST
      form:
        categoryId: "13"          # 13=通知公告，12=新闻热点，改这个即可换栏目
        pageNo: "1"
        pageSize: "50"
      items_path: object.newsPage.list
      title_field: title
      url_field: url
      url_base: https://scc.pku.edu.cn
      date_field: releaseDate
      default_category: 就业实习
      content_fields: [description, publisher, category.name]
      field_labels:
        description: 摘要
        publisher: 发布
        category.name: 栏目
      interval_minutes: 60
      limit: 50
      weight: 1.4

    - name: 北大就业·招聘信息
      campus: 北大本部
      enabled: true
      url: https://scc.pku.edu.cn/f/recruitmentinfo/ajax_frontRecruitinfo
      method: POST
      form:
        pageNo: "1"
        pageSize: "50"
        positionType: "1"         # 1=招聘，2=实习
        city: ""
        title: ""
      items_path: object.list
      title_field: title
      url_field: url
      url_base: https://scc.pku.edu.cn
      date_field: startTime
      default_category: 就业实习
      content_fields: [corporationName, positionNum, education, majorName, endTime]
      field_labels:
        corporationName: 单位
        positionNum: 招聘人数
        education: 学历要求
        majorName: 专业要求
        endTime: 截止时间
      interval_minutes: 60
      limit: 50
      weight: 1.4

    - name: 北大就业·宣讲会
      campus: 北大本部
      enabled: true
      url: https://scc.pku.edu.cn/f/recruitmentFair/ajax_frontRecruitfair
      method: GET
      params:
        pageNo: "1"
        pageSize: "50"
        fairType: "1"
      items_path: object.list
      title_field: title
      url_field: url
      url_base: https://scc.pku.edu.cn
      date_field: startTime
      expire_field: endTime
      default_category: 就业实习
      content_fields: [place, corporationinfo.name, holdTimeExport, endTime]
      field_labels:
        place: 地点
        corporationinfo.name: 单位
        holdTimeExport: 举办时间
        endTime: 结束时间
      interval_minutes: 60
      limit: 50
      weight: 1.5

    # ===== 医学部就业指导中心（scdc.bjmu.edu.cn）=====
    # ⚠️ 两个坑：
    #   1) 必须带 X-Requested-With: XMLHttpRequest，否则返回的是完整 HTML 页面而不是 JSON
    #      （和讲座网同一个套路，实测确认）
    #   2) 这站极慢：单次 21~50 秒，超 nginx 60s 上限会吐 504，
    #      所以 timeout 设 120 秒，抓取间隔也放长，别把人家站打挂
    # 返回头写 text/html 但 body 是 JSON，采集器已做容错解析。
    - name: 医学部就业·就业信息
      campus: 医学部
      enabled: true
      url: https://scdc.bjmu.edu.cn/portal/home/recruitment-list.html
      params:
        menuId: "30"
      method: POST
      headers:
        X-Requested-With: XMLHttpRequest
      form:
        pageIndex: "0"
        pageSize: "30"
        currentPage: "1"
      timeout_seconds: 120
      items_path: data
      title_field: title
      url_template: "https://scdc.bjmu.edu.cn/portal/home/recruitment-details.html?id={id}&menuId=30"
      date_field: publishTime
      default_category: 就业实习
      content_fields: [enterpriseName, content.value, applyTime, dictRecruitmentTypeValue]
      field_labels:
        enterpriseName: 单位
        content.value: 简介
        applyTime: 申请时间
        dictRecruitmentTypeValue: 类型
      interval_minutes: 180
      limit: 30
      weight: 1.4

    # 新闻公告栏目：最新一条停在 2022-09-30，基本是僵尸栏目。
    # 仍然接上（这样"源状态"面板会如实显示它停更），但间隔放到 6 小时。
    - name: 医学部就业·新闻公告
      campus: 医学部
      enabled: true
      url: https://scdc.bjmu.edu.cn/portal/home/bulletinInfo-list.html
      params:
        baseBulletinInfoVo.menuId: "10"
      method: POST
      headers:
        X-Requested-With: XMLHttpRequest
      form:
        pageIndex: "0"
        pageSize: "20"
        currentPage: "1"
      timeout_seconds: 120
      items_path: data
      title_field: title.value
      url_template: "https://scdc.bjmu.edu.cn/portal/home/bulletinInfo-details.html?id={id}&menuId=10"
      date_field: createTime.value
      default_category: 就业实习
      content_fields: [content.value, publisher.value, source.value]
      field_labels:
        content.value: 内容
        publisher.value: 发布
        source.value: 来源
      interval_minutes: 360
      limit: 20
      weight: 1.2


    # ===== 北大校内门户（免登录 JSON，一个源盖住全校）=====
    # 子代理在 NoticeService.js 里挖到的接口，实测裸请求即返回 JSON，
    # 不需要 token / cookie / 任何特殊头。
    # 「部门通知」两万多条，含停水停电、场馆开放、各院系通知，是覆盖面最广的一个源。
    - name: 北大门户·部门通知
      campus: 北大本部
      url: https://portal.pku.edu.cn/portal2017/notice/retrAllDeptNotice.do
      method: GET
      params:
        start: "0"
        limit: "50"
        keyword: ALL
      items_path: rows
      title_field: Title
      date_field: Time
      url_field: DocUrl
      default_category: 行政通知
      content_fields: [Department, Type]
      field_labels:
        Department: 发布单位
        Type: 类型
      interval_minutes: 15
      limit: 50
      weight: 1.7

    - name: 北大门户·学校通知
      campus: 北大本部
      url: https://portal.pku.edu.cn/portal2017/notice/retrAllSchoolNotice.do
      method: GET
      params:
        start: "0"
        limit: "50"
        keyword: ALL
      items_path: rows
      title_field: Title
      date_field: Time
      url_field: DocUrl
      default_category: 行政通知
      content_fields: [Department, Type]
      field_labels:
        Department: 发布单位
        Type: 类型
      interval_minutes: 15
      limit: 50
      weight: 1.7

